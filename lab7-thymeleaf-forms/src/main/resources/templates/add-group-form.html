<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Форма учебной группы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1 th:text="${group.id == null} ? 'Добавить учебную группу' : 'Изменить учебную группу'">Учебная группа</h1>
    <form th:action="@{/groups/save}" th:object="${group}" method="post" class="col-md-6">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label for="groupNumber" class="form-label">Номер группы</label>
            <input id="groupNumber" type="text" th:field="*{groupNumber}" maxlength="20" required class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('groupNumber')}" th:errors="*{groupNumber}"></div>
        </div>
        <div class="mb-3">
            <label for="faculty" class="form-label">Факультет</label>
            <input id="faculty" type="text" th:field="*{faculty}" maxlength="20" required class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('faculty')}" th:errors="*{faculty}"></div>
        </div>
        <div class="mb-3">
            <label for="course" class="form-label">Курс</label>
            <input id="course" type="number" th:field="*{course}" min="1" max="6" required class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a th:href="@{/groups/list}" class="btn btn-outline-secondary">К списку</a>
    </form>
</main>
</body>
</html>
