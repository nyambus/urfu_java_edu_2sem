<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список учебных групп</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1>Учебные группы</h1>
    <nav class="mb-3 d-flex gap-2">
        <a th:href="@{/groups/add-form}" class="btn btn-primary">Добавить группу</a>
        <a th:href="@{/list}" class="btn btn-outline-primary">Студенты</a>
    </nav>
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead><tr><th scope="col">Номер группы</th><th scope="col">Факультет</th><th scope="col">Курс</th><th scope="col">Действия</th></tr></thead>
            <tbody>
            <tr th:each="group : ${groups}">
                <td th:text="${group.groupNumber}"></td>
                <td th:text="${group.faculty}"></td>
                <td th:text="${group.course}"></td>
                <td>
                    <a th:href="@{/groups/update-form(groupId=${group.id})}" class="btn btn-sm btn-outline-primary">Изменить</a>
                    <form th:action="@{/groups/delete}" method="post" class="d-inline">
                        <input type="hidden" name="groupId" th:value="${group.id}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(groups)}"><td colspan="4">Учебные группы пока не добавлены.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
