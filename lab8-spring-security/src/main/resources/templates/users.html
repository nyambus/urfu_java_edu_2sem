<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пользователи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1>Зарегистрированные пользователи</h1>
    <nav class="mb-3 d-flex gap-2 align-items-center">
        <a th:href="@{/list}" class="btn btn-outline-primary">Студенты</a>
        <form th:action="@{/logout}" method="post" class="ms-auto"><button type="submit" class="btn btn-outline-secondary">Выйти</button></form>
    </nav>
    <div class="table-responsive">
        <table class="table table-striped table-bordered">
            <thead><tr><th scope="col">Имя</th><th scope="col">Фамилия</th><th scope="col">Электронная почта</th></tr></thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.firstName}"></td>
                <td th:text="${user.lastName}"></td>
                <td th:text="${user.email}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}"><td colspan="3">Пользователей пока нет.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
