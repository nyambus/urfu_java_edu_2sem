<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация — студенты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1>Регистрация пользователя</h1>
    <p th:if="${param.success}" class="alert alert-success">Регистрация прошла успешно. Теперь войдите в систему.</p>
    <form th:action="@{/register/save}" th:object="${user}" method="post" class="col-md-6">
        <div class="mb-3">
            <label for="firstName" class="form-label">Имя</label>
            <input id="firstName" type="text" th:field="*{firstName}" maxlength="80" required class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
        </div>
        <div class="mb-3">
            <label for="lastName" class="form-label">Фамилия</label>
            <input id="lastName" type="text" th:field="*{lastName}" maxlength="80" required class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Электронная почта (email)</label>
            <input id="email" type="email" th:field="*{email}" maxlength="254" required autocomplete="email" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Пароль (не менее 8 символов)</label>
            <input id="password" name="password" type="password" minlength="8" maxlength="72" required autocomplete="new-password" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        <a th:href="@{/login}" class="btn btn-outline-secondary">Уже есть аккаунт? Войти</a>
        <a th:href="@{/}" class="btn btn-link">Главная</a>
    </form>
</main>
</body>
</html>
