<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список студентов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1>Студенты</h1>
    <nav class="mb-3 d-flex gap-2 align-items-center">
        <a th:href="@{/addStudentForm}" class="btn btn-primary">Добавить студента</a>
        <a th:href="@{/users}" class="btn btn-outline-primary">Пользователи</a>
        <form th:action="@{/logout}" method="post" class="ms-auto"><button type="submit" class="btn btn-outline-secondary">Выйти</button></form>
    </nav>
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead><tr><th scope="col">Имя</th><th scope="col">Фамилия</th><th scope="col">Факультет</th><th scope="col">Возраст</th><th scope="col">Действия</th></tr></thead>
            <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.name}"></td>
                <td th:text="${student.surname}"></td>
                <td th:text="${student.faculty}"></td>
                <td th:text="${student.age}"></td>
                <td>
                    <a th:href="@{/showUpdateForm(studentId=${student.id})}" class="btn btn-sm btn-outline-primary">Изменить</a>
                    <form th:action="@{/deleteStudent}" method="post" class="d-inline">
                        <input type="hidden" name="studentId" th:value="${student.id}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(students)}"><td colspan="5">Студенты пока не добавлены.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
