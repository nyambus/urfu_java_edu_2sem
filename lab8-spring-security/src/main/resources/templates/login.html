<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — студенты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1>Вход в систему</h1>
    <p th:if="${param.error}" class="alert alert-danger">Неверный адрес электронной почты или пароль.</p>
    <p th:if="${param.logout}" class="alert alert-success">Вы вышли из системы.</p>
    <form th:action="@{/login}" method="post" class="col-md-6">
        <div class="mb-3">
            <label for="username" class="form-label">Электронная почта (email)</label>
            <input id="username" name="username" type="email" required autocomplete="username" class="form-control">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input id="password" name="password" type="password" required autocomplete="current-password" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Войти</button>
        <a th:href="@{/register}" class="btn btn-outline-secondary">Регистрация</a>
        <a th:href="@{/}" class="btn btn-link">Главная</a>
    </form>
</main>
</body>
</html>
