<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Форма студента</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1 th:text="${student.id == null} ? 'Добавить студента' : 'Изменить студента'">Студент</h1>
    <form th:action="@{/saveStudent}" th:object="${student}" method="post" class="col-md-6">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label for="name" class="form-label">Имя</label>
            <input id="name" type="text" th:field="*{name}" maxlength="15" required class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label for="surname" class="form-label">Фамилия</label>
            <input id="surname" type="text" th:field="*{surname}" maxlength="25" required class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}"></div>
        </div>
        <div class="mb-3">
            <label for="faculty" class="form-label">Факультет</label>
            <input id="faculty" type="text" th:field="*{faculty}" maxlength="20" required class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('faculty')}" th:errors="*{faculty}"></div>
        </div>
        <div class="mb-3">
            <label for="age" class="form-label">Возраст</label>
            <input id="age" type="number" th:field="*{age}" min="1" max="120" required class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a th:href="@{/list}" class="btn btn-outline-secondary">К списку</a>
    </form>
</main>
</body>
</html>
